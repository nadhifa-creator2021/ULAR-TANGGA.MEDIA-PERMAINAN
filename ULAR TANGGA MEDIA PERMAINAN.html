<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jalan Menuju Pertemanan Sehat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
:root{--bg:#F2F7FC;--pan:#fff;--ink:#1F2A44;--mut:#5A6B87;--navy:#12284C;--gold:#FFB800;--line:#D2DFF0;--sh:rgba(127,151,184,.35);--f:Calibri,Carlito,Lato,'Segoe UI',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1630;--pan:#16264A;--ink:#E8EEF9;--mut:#A9B8D4;--line:#2B3D66;--sh:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1630;--pan:#16264A;--ink:#E8EEF9;--mut:#A9B8D4;--line:#2B3D66;--sh:rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f);overflow-x:hidden}
h1,h2,h3{margin:0 0 .3em;line-height:1.1;font-weight:700}
.wrap{max-width:1180px;margin:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) 40px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:clamp(1.3rem,3.2vw,2rem);color:var(--ink);margin:0;flex:1;min-width:230px}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:99px;padding:4px 14px;font-size:.82rem;font-weight:700;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:12px 26px;min-height:48px;background:var(--gold);color:var(--navy);font:700 1.1rem var(--f);cursor:pointer;box-shadow:0 8px 18px -8px var(--sh)}
.btn:hover{filter:brightness(1.05)}.btn[disabled]{opacity:.5;pointer-events:none}
.btn.nv{background:var(--navy);color:#fff}.btn.sm{padding:8px 16px;min-height:42px;font-size:.95rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{background:var(--pan);border-radius:20px;padding:clamp(14px,2.5vw,24px);box-shadow:0 10px 24px -10px var(--sh)}
.hero{background:var(--navy);color:#fff;border-radius:24px;display:grid;grid-template-columns:1.2fr .8fr;gap:20px;padding:clamp(18px,4vw,44px);position:relative;overflow:hidden}
.hero small{color:var(--gold);font-weight:700;letter-spacing:.3em;font-size:.8rem}
.hero h2{font-size:clamp(2rem,5.5vw,3.6rem);margin:.25em 0 .35em}
.hero p{color:#D2DFF0;margin:0 0 14px;max-width:34em}
.hero .strip{margin:14px 0}.hero label{display:flex;align-items:center;gap:8px;margin:6px 0}
.hero .art{text-align:center;position:relative;display:flex;align-items:flex-end;justify-content:center}
.hero .art img{max-height:360px;max-width:100%}
.tag{position:absolute;border-radius:12px;padding:8px 14px;font-weight:700;color:#fff}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sel button{border:2px solid #8FB0DC;background:transparent;color:#fff;border-radius:12px;padding:8px 16px;font:700 1rem var(--f);cursor:pointer;min-height:44px}
.sel button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
input[type=text]{border:2px solid #8FB0DC;background:#fff;color:var(--navy);border-radius:10px;padding:8px 12px;font:400 1rem var(--f);min-height:42px;width:100%;max-width:240px}
.g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;align-items:start}
.bwrap{border:6px solid var(--gold);border-radius:18px;overflow:hidden;position:sticky;top:10px;background:#fff}
.board{position:relative;aspect-ratio:821/692}.board img{width:100%;height:100%;display:block}
.pw{position:absolute;width:3.1%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.45);transform:translate(-50%,-50%)}
.pw.me{outline:3px solid var(--navy);z-index:2}
.sb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pl{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:6px 12px;border:2px solid transparent}
.pl.on{border-color:var(--gold);background:var(--pan);box-shadow:0 4px 10px -4px var(--sh)}.pl.dn{opacity:.65}
.pl i{width:14px;height:14px;border-radius:50%;flex:none}.pl small{color:var(--mut);display:block;line-height:1.1}
.turn{display:flex;align-items:center;gap:14px;margin:8px 0}.turn img{height:120px}
.dw{display:flex;align-items:center;gap:16px;margin-top:8px}.dice{font-size:4.2rem;line-height:1;color:var(--navy)}
.sm{font-size:.9rem;color:var(--mut)}
.card{border-radius:18px;padding:14px;background:var(--t);border:2px solid var(--d);color:#1F2A44}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.num{background:var(--d);color:#fff;border-radius:10px;padding:4px 12px;font-size:1.3rem;font-weight:700}
.zn{font-weight:700;color:var(--d);flex:1}.mv{background:#fff;border-radius:99px;padding:3px 12px;font-weight:700;font-size:.85rem}
.sit{font-size:1.1rem;margin:0 0 10px}
.q{background:rgba(255,255,255,.72);border-radius:12px;padding:10px 12px;margin-top:8px}
.q b{display:flex;gap:8px;font-weight:700;color:#12284C}.q b span{background:var(--d);color:#fff;border-radius:50%;width:24px;height:24px;flex:none;display:grid;place-items:center;font-size:.85rem}
.op{display:block;width:100%;text-align:left;margin-top:6px;border:2px solid var(--d);background:#fff;color:#1F2A44;border-radius:10px;padding:8px 12px;font:400 1rem/1.35 var(--f);cursor:pointer;min-height:44px}
.op[aria-pressed=true]{background:var(--d);color:#fff}.fb{margin-top:6px;font-size:.92rem;color:#12284C}
.snk{border-color:#B3261E;--d:#B3261E;--t:#FDE3E1}
.sheet{background:#fff;color:#1F2A44;border-radius:16px;padding:28px;max-width:820px;margin:0 auto;box-shadow:0 10px 24px -10px var(--sh)}
.sheet h2{font-size:1.6rem;color:#12284C}.sheet h3{color:#12284C;margin:14px 0 4px}.sheet table,.tb{width:100%;border-collapse:collapse;margin:8px 0}
.sheet td,.sheet th{border:1px solid #D2DFF0;padding:6px 8px;text-align:left;vertical-align:top;font-size:.92rem}.sheet th{background:#CFE3F8}.sheet small{color:#5A6B87}
.tb td,.tb th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:.92rem}.tb th{color:var(--mut)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.kpi div{background:var(--pan);border-radius:14px;padding:12px;box-shadow:0 6px 14px -8px var(--sh)}.kpi b{display:block;font-size:1.8rem;color:var(--navy)}
@media(prefers-color-scheme:dark){.kpi b{color:var(--gold)}}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:#3DB58A}
.sel2{padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--pan);color:var(--ink);font:400 1rem var(--f);min-height:42px}
@media print{.noprint,.top,.foot{display:none!important}body{background:#fff}.wrap{padding:0}.sheet{box-shadow:none;border-radius:0;padding:0;max-width:none}.sheet tr{break-inside:avoid}}
textarea{width:100%;margin-top:8px;border:2px solid var(--d);border-radius:10px;padding:8px 10px;font:400 1rem/1.4 var(--f);min-height:64px;resize:vertical;background:#fff;color:#1F2A44}
.co{background:var(--navy);color:var(--gold);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
.end{background:var(--navy);color:#fff;border-radius:24px;padding:clamp(18px,4vw,40px);text-align:center}
.end h2{font-size:clamp(1.8rem,4vw,2.6rem)}.end img{height:200px}.end p{color:#D2DFF0}
.end details{background:#fff;color:#1F2A44;border-radius:12px;padding:10px 14px;margin:8px auto;max-width:720px;text-align:left}
.end summary{font-weight:700;cursor:pointer}.end .a{margin:8px 0;padding-left:10px;border-left:4px solid var(--gold)}
.foot{font-size:.82rem;color:var(--mut);margin-top:18px}
@media(max-width:820px){.hero,.g{grid-template-columns:1fr}.bwrap{position:static}.hero .art img{max-height:240px}}
</style></head><body>
<div class="wrap">
<div class="top"><h1>Jalan Menuju Pertemanan Sehat</h1><div class="strip" id="strip"></div><button class="btn sm nv" id="reset" hidden>Mulai ulang</button></div>
<main id="app" aria-live="polite"></main>
<p class="foot">Media refleksi untuk mahasiswa baru: bukan tes, bukan diagnosis, dan bukan pengganti layanan konseling. Jawaban hanya tersimpan selama halaman ini terbuka. Jika ada krisis, arahkan ke layanan kampus resmi.</p>
</div>

const HDR=['Pemain','Kotak','Jenis','Zona','Pilar','Situasi','No.','Pertanyaan','Tipe','Jawaban','Pilihan paling sehat','Sesuai pilihan paling sehat'];
const rowArr=r=>[r.pm,r.no,r.sn?'Pertanyaan ular':'Kartu situasi',r.z,r.pilar,r.s,r.i+1,r.q,r.tipe,r.v,r.best,r.ok];
async function saveX(wb,name,el){try{const dl=await claude.use('downloads');if(!dl||!window.XLSX){el.textContent='Unduhan Excel tidak tersedia di tampilan ini.';return}

async function xls(){const m=$('#xm');if(!window.XLSX){m.textContent='Unduhan Excel tidak tersedia di tampilan ini.';return}
 const R=flat(),T=[['Pemain','Set pertanyaan dikunjungi','Pertanyaan terjawab','Pilihan ganda dijawab','Sesuai pilihan paling sehat']];
 names.slice(0,np).forEach((n,i)=>{const a=R.filter(r=>r.pi===i);T.push([n,new Set(a.map(r=>r.no+(r.sn?'s':''))).size,a.filter(r=>r.v).length,a.filter(r=>r.ok).length,a.filter(r=>r.ok==='Ya').length])});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet([HDR,...R.map(rowArr)],[14,7,16,9,14,40,5,50,14,50,40,14]),'Jawaban');XLSX.utils.book_append_sheet(wb,sheet(T),'Ringkasan');

async function kirim(){const set=t=>{const e=$('#ks');if(e)e.textContent=t};if(G.ok){set('Sudah terkirim ke panitia.');return}
 try{const db=await claude.use('db');if(!db){set('Belum terhubung ke panitia. Unduh Excel atau cetak lembar keterangan, lalu serahkan ke panitia.');return}
 const us=await claude.use('user'),id=us&&await us.id();if(!id){set('Belum masuk akun claude.ai, jadi belum bisa dikirim. Unduh Excel atau cetak lembar keterangan, lalu serahkan ke panitia.');return}
 const ref=db.doc('sesi/'+id),sn=await ref.get().catch(()=>null),runs=(sn&&sn.exists&&sn.data().runs)||[];runs.push({kelompok:grp,waktu:Date.now(),pemain:names.slice(0,np),baris:flat().map(r=>[r.pi,r.no,r.sn?1:0,r.i,r.v])});await ref.set({runs});G.ok=1;set('Terkirim ke panitia. Terima kasih!')}
 catch(e){set('Gagal mengirim ke panitia. Unduh Excel atau cetak lembar keterangan, lalu serahkan ke panitia.')}}
function lembarHTML(i){const R=flat().filter(r=>r.pi===i),mc=R.filter(r=>r.tipe==='Pilihan ganda'&&r.v),ok=mc.filter(r=>r.ok==='Ya').length,ty=R.filter(r=>r.tipe==='Ketik'&&r.v);
 const tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
 const pr=PIL.map(p=>{const a=mc.filter(r=>r.pilar===p[0]),o=a.filter(r=>r.ok==='Ya').length,c=a.length?o/a.length:null,lv=c===null?'Belum ada kotak pilar ini':c>=.67?'Sudah kuat':c>=.34?'Sedang berkembang':'Perlu dilatih lagi';return`<tr><td><b>${p[0]}</b><br><small>zona ${p[1]}</small></td><td>${a.length?o+' dari '+a.length:'-'}</td><td><b>${lv}</b><br>${TIP[p[0]]}</td></tr>`}).join('');
 return`<h2>Lembar Keterangan Refleksi</h2><p><b>Jalan Menuju Pertemanan Sehat</b> · Friendship Check</p><p>Nama: <b>${esc(names[i])}</b>${grp?` · Kelompok: <b>${esc(grp)}</b>`:''} · ${tgl}</p>
 <p>Kamu mengunjungi <b>${new Set(R.map(r=>r.no+(r.sn?'s':''))).size}</b> set pertanyaan, menjawab <b>${R.filter(r=>r.v).length}</b> pertanyaan, dan <b>${ok} dari ${mc.length}</b> pilihan gandamu sama dengan pilihan paling sehat.</p>
 <h3>Keterangan per pilar</h3><table><tr><th>Pilar</th><th>Pilihan sehat</th><th>Keterangan dan saran</th></tr>${pr}</table>
 <h3>Pilihan gandamu</h3><table><tr><th>Kotak</th><th>Pertanyaan</th><th>Pilihanmu</th><th>Paling sehat</th></tr>${mc.map(r=>`<tr><td>${r.sn?'Ular ':''}${r.no}</td><td>${esc(r.q)}</td><td>${esc(r.v)}</td><td>${esc(r.best)}</td></tr>`).join('')||'<tr><td colspan="4">Belum ada.</td></tr>'}</table>
 <h3>Jawaban tertulismu</h3>${ty.map(r=>`<p><small>Kotak ${r.sn?'ular ':''}${r.no} · ${esc(r.q)}</small><br>${esc(r.v)}</p>`).join('')||'<p><small>Belum ada jawaban tertulis.</small></p>'}
 <p><small>Lembar ini adalah bahan refleksi, bukan tes atau diagnosis. Jika kamu butuh teman bicara, hubungi konselor atau layanan kampus resmi.</small></p>`}

async function dlLembar(){const m=$('#xm');try{const dl=await claude.use('downloads');if(!dl){m.textContent='Unduhan tidak tersedia di tampilan ini.';return}
 const css='body{font:16px/1.45 Calibri,Carlito,Arial,sans-serif;color:#1F2A44;max-width:820px;margin:24px auto;padding:0 16px}table{width:100%;border-collapse:collapse;margin:8px 0}td,th{border:1px solid #D2DFF0;padding:6px 8px;text-align:left;vertical-align:top;font-size:14px}th{background:#CFE3F8}small{color:#5A6B87}h2,h3{color:#12284C}tr{break-inside:avoid}';

let S=[],pOn=0,dbErr='',fz='',fq='';
const mkRow=(pm,no,sn,i,v)=>{const c=CARD[no];if(!c)return null;const q=(sn?SQ[no]:c.qs)[i];if(!q)return null;v=v||'';return{pm,no:+no,sn:!!sn,i,z:c.z,pilar:ZN[c.z][0],s:c.s||'',q:q.q,tipe:q.o?'Pilihan ganda':'Ketik',v,best:q.o?q.o[0]:'',ok:q.o&&v?(v===q.o[0]?'Ya':'Tidak'):''}};
function pStart(){claude.use('db').then(db=>{if(!db){dbErr='Data langsung tidak tersedia (belum masuk akun claude.ai atau tidak punya akses). Anda tetap bisa mengimpor file Excel dari tiap kelompok.';pRender();return}
 db.collection('sesi').onSnapshot(s=>{S=S.filter(x=>x.src!=='Langsung').concat(s.docs.flatMap(d=>((d.data()||{}).runs||[]).map((x,k)=>({id:d.id+k,src:'Langsung',kel:x.kelompok||'(tanpa nama)',waktu:x.waktu||0,pemain:x.pemain||[],rows:(x.baris||[]).map(a=>mkRow((x.pemain||[])[a[0]]||'?',a[1],a[2],a[3],a[4])).filter(Boolean)}))));dbErr='';pRender()},
 e=>{dbErr='Tidak bisa membaca data responden langsung ('+(e&&e.code||'error')+'). Hanya Editor atau pemilik artefak yang boleh membaca. Anda tetap bisa mengimpor file Excel.';pRender()})}).catch(()=>{dbErr='Data langsung tidak tersedia.';pRender()})}
async function imp(files){for(const f of files){try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets['Jawaban'];if(!ws)continue;const J=XLSX.utils.sheet_to_json(ws);
 S.push({id:'f'+Date.now()+f.name,src:'Excel',kel:f.name.replace(/\.xlsx$/i,''),waktu:f.lastModified,pemain:[...new Set(J.map(r=>r['Pemain']))],rows:J.map(r=>({pm:r['Pemain'],no:r['Kotak'],sn:r['Jenis']==='Pertanyaan ular',i:r['No.']-1,z:r['Zona'],pilar:r['Pilar'],s:r['Situasi']||'',q:r['Pertanyaan'],tipe:r['Tipe'],v:String(r['Jawaban']||''),best:r['Pilihan paling sehat']||'',ok:r['Sesuai pilihan paling sehat']||''}))})}catch(e){}}pRender()}
const allR=()=>S.flatMap(s=>s.rows.map(r=>({...r,kel:s.kel,src:s.src})));
function agg(A){const mc=A.filter(r=>r.tipe==='Pilihan ganda'&&r.v);return{n:mc.length,ok:mc.filter(r=>r.ok==='Ya').length,ty:A.filter(r=>r.tipe==='Ketik'&&r.v).length}}
async function pExport(){const m=$('#pm');if(!window.XLSX){m.textContent='Unduhan Excel tidak tersedia.';return}const A=allR(),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,sheet([['Kelompok','Sumber',...HDR],...A.map(r=>[r.kel,r.src,...rowArr(r)])],[18,10,14,7,16,9,14,40,5,50,14,50,40,14]),'Semua jawaban');
 XLSX.utils.book_append_sheet(wb,sheet([['Pilar','Pilihan ganda dijawab','Sesuai pilihan paling sehat','% sesuai','Jawaban ketik terisi'],...PIL.map(p=>{const g=agg(A.filter(r=>r.pilar===p[0]));return[p[0],g.n,g.ok,pct(g.ok,g.n),g.ty]})]),'Per pilar');
 XLSX.utils.book_append_sheet(wb,sheet([['Kotak','Pilar','Pilihan ganda dijawab','Sesuai pilihan paling sehat','% sesuai','Jawaban ketik terisi'],...Object.keys(CARD).map(n=>{const g=agg(A.filter(r=>r.no==n&&!r.sn));return[+n,ZN[CARD[n].z][0],g.n,g.ok,pct(g.ok,g.n),g.ty]})]),'Per kotak');
 XLSX.utils.book_append_sheet(wb,sheet([['Kelompok','Sumber','Waktu','Pemain','Jumlah baris'],...S.map(s=>[s.kel,s.src,s.waktu?new Date(s.waktu).toLocaleString('id-ID'):'',s.pemain.join(', '),s.rows.length])]),'Sesi');
 saveX(wb,'rekap-responden-pertemanan-sehat.xlsx',m)}
function pRender(){if(!isP())return;$('#reset').hidden=true;const t=document.querySelector('.top h1');if(t)t.textContent='Dasbor Panitia';if(!pOn){pOn=1;pStart()}
 const A=allR(),g=agg(A),pl=new Set(A.map(r=>r.kel+'|'+r.pm)).size,sel=document.activeElement&&document.activeElement.id,
 L=A.filter(r=>r.v&&(!fz||r.pilar===fz)&&(!fq||String(r.no)===fq.trim())).slice(0,300);
 $('#app').innerHTML=`<section class="panel"><h2>Data responden</h2><p class="sm">${dbErr?esc(dbErr):'Terhubung: jawaban yang dikirim peserta tampil otomatis di sini.'}</p>
 <p><label class="btn sm nv" style="display:inline-flex;align-items:center">Impor file Excel kelompok<input id="pf" type="file" accept=".xlsx" multiple hidden></label> <button class="btn sm" data-a="pxls" ${S.length?'':'disabled'}>Unduh rekap (Excel)</button></p><p class="sm" id="pm"></p>

 <h3>Per pilar</h3><table class="tb"><tr><th>Pilar</th><th>Pilihan ganda</th><th>Sesuai</th><th></th><th>Jawaban ketik</th></tr>${PIL.map(p=>{const a=agg(A.filter(r=>r.pilar===p[0]));return`<tr><td><b style="color:${p[2]}">${p[0]}</b></td><td>${a.n}</td><td>${a.n?pct(a.ok,a.n)+'%':'-'}</td><td><div class="bar"><i style="width:${pct(a.ok,a.n)}%"></i></div></td><td>${a.ty}</td></tr>`}).join('')}</table>
 <details><summary><b>Per kotak (48 kartu)</b></summary><table class="tb"><tr><th>Kotak</th><th>Pilar</th><th>Pilihan ganda</th><th>% sesuai</th><th>Ketik</th></tr>${Object.keys(CARD).map(n=>{const a=agg(A.filter(r=>r.no==n&&!r.sn));return`<tr><td>${n}</td><td>${ZN[CARD[n].z][0]}</td><td>${a.n}</td><td>${a.n?pct(a.ok,a.n)+'%':'-'}</td><td>${a.ty}</td></tr>`}).join('')}</table></details>
 <h3>Daftar sesi</h3>${S.length?S.map(s=>`<details><summary><b>${esc(s.kel)}</b> · ${s.src} · ${esc(s.pemain.join(', '))}${s.waktu?' · '+new Date(s.waktu).toLocaleString('id-ID'):''}</summary>${s.rows.filter(r=>r.v).map(r=>`<p class="sm"><b>${esc(r.pm)}</b> · kotak ${r.sn?'ular ':''}${r.no} · ${esc(r.q)}<br>${esc(r.v)}${r.ok?' ('+(r.ok==='Ya'?'sesuai':'berbeda')+')':''}</p>`).join('')||'<p class="sm">Belum ada jawaban.</p>'}</details>`).join(''):'<p class="sm">Belum ada data. Peserta yang selesai bermain akan muncul di sini, atau impor file Excel mereka.</p>'}
 <h3>Cari jawaban</h3><p><select class="sel2" id="pz" aria-label="Filter pilar"><option value="">Semua pilar</option>${PIL.map(p=>`<option ${fz===p[0]?'selected':''}>${p[0]}</option>`).join('')}</select> <input type="text" id="pq" placeholder="No. kotak" value="${esc(fq)}" style="max-width:120px;border-color:var(--line);background:var(--pan);color:var(--ink)"></p>
 <table class="tb"><tr><th>Kelompok</th><th>Pemain</th><th>Kotak</th><th>Pertanyaan</th><th>Jawaban</th></tr>${L.map(r=>`<tr><td>${esc(r.kel)}</td><td>${esc(r.pm)}</td><td>${r.sn?'Ular ':''}${r.no}</td><td>${esc(r.q)}</td><td>${esc(r.v)}</td></tr>`).join('')||'<tr><td colspan="5">Tidak ada jawaban.</td></tr>'}</table>${A.filter(r=>r.v).length>300?'<p class="sm">Menampilkan 300 baris pertama; unduh Excel untuk semuanya.</p>':''}</section>`;
 if(sel){const e=document.getElementById(sel);if(e){e.focus();if(e.setSelectionRange&&e.type==='text')e.setSelectionRange(e.value.length,e.value.length)}}}
